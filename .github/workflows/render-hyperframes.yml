name: Render HyperFrames MP4

on:
  workflow_dispatch:
    inputs:
      html_base64:
        description: Base64-encoded standalone HyperFrames HTML
        required: false
        type: string
      output_filename:
        description: Validated MP4 asset filename
        required: false
        type: string
      html_b64:
        description: Legacy alias for html_base64
        required: false
        type: string
      output_name:
        description: Legacy alias for output_filename
        required: false
        type: string
      narration_text:
        description: Narration copy synthesized by ElevenLabs on the runner
        required: true
        type: string
      elevenlabs_voice_id:
        description: ElevenLabs voice ID (uses the established Renuvo voice by default)
        required: false
        default: EyRf2vN1QWFKpAubRauZ
        type: string

permissions:
  contents: write

concurrency:
  group: renuvo-renders
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HYPERFRAMES_RUN_ID: renuvo-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_TAG: renuvo-renders
    steps:
      - name: Check out renderer
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install pinned renderer dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts=false
          installed_hyperframes="$(node -p "require('./node_modules/hyperframes/package.json').version")"
          installed_gsap="$(node -p "require('./node_modules/gsap/package.json').version")"
          test "$installed_hyperframes" = "0.8.30"
          case "$installed_gsap" in
            3.*) ;;
            *) echo "Expected GSAP 3.x, got $installed_gsap" >&2; exit 1 ;;
          esac

      - name: Validate inputs and decode temporary project
        env:
          CURRENT_HTML_BASE64: ${{ inputs.html_base64 }}
          CURRENT_FILENAME: ${{ inputs.output_filename }}
          LEGACY_HTML_BASE64: ${{ inputs.html_b64 }}
          LEGACY_FILENAME: ${{ inputs.output_name }}
          NARRATION_TEXT: ${{ inputs.narration_text }}
          ELEVENLABS_VOICE_ID: ${{ inputs.elevenlabs_voice_id }}
        run: |
          set -euo pipefail
          if [[ -n "$CURRENT_HTML_BASE64" && -n "$LEGACY_HTML_BASE64" && "$CURRENT_HTML_BASE64" != "$LEGACY_HTML_BASE64" ]]; then
            echo "Conflicting HTML inputs were provided" >&2
            exit 1
          fi
          if [[ -n "$CURRENT_FILENAME" && -n "$LEGACY_FILENAME" && "$CURRENT_FILENAME" != "$LEGACY_FILENAME" ]]; then
            echo "Conflicting filename inputs were provided" >&2
            exit 1
          fi
          HTML_BASE64="${CURRENT_HTML_BASE64:-$LEGACY_HTML_BASE64}"
          REQUESTED_FILENAME="${CURRENT_FILENAME:-$LEGACY_FILENAME}"
          if [[ ! "$REQUESTED_FILENAME" =~ ^renuvo-[a-z0-9-]{1,96}\.mp4$ ]]; then
            echo "Invalid output filename" >&2
            exit 1
          fi
          if (( ${#HTML_BASE64} == 0 || ${#HTML_BASE64} > 60000 )); then
            echo "Base64 HTML input is empty or exceeds the safe dispatch limit" >&2
            exit 1
          fi
          if (( ${#NARRATION_TEXT} == 0 || ${#NARRATION_TEXT} > 1600 )); then
            echo "Narration text is empty or too long" >&2
            exit 1
          fi
          retired_copy="Turn regular customers"" into recurring revenue"
          if [[ "$NARRATION_TEXT" == *"$retired_copy"* ]]; then
            echo "Narration contains retired Renuvo marketing copy" >&2
            exit 1
          fi
          if [[ ! "$ELEVENLABS_VOICE_ID" =~ ^[A-Za-z0-9_-]{8,64}$ ]]; then
            echo "Invalid ElevenLabs voice ID" >&2
            exit 1
          fi
          project_dir="$RUNNER_TEMP/renuvo-hyperframes-project"
          output_dir="$RUNNER_TEMP/renuvo-hyperframes-output"
          install -d "$project_dir/vendor" "$project_dir/media" "$output_dir"
          printf '%s' "$HTML_BASE64" | base64 --decode > "$project_dir/index.html"
          test -s "$project_dir/index.html"
          cp node_modules/gsap/dist/gsap.min.js "$project_dir/vendor/gsap.min.js"
          cp assets/brand/renuvo-lockup-horizontal-ivory.svg "$project_dir/media/renuvo-lockup-horizontal-ivory.svg"
          cp assets/brand/renuvo-lockup-horizontal-ink.svg "$project_dir/media/renuvo-lockup-horizontal-ink.svg"
          cp assets/audio/music-bed-60s.wav "$project_dir/media/music-bed-60s.wav"
          test -s "$project_dir/vendor/gsap.min.js"
          test -s "$project_dir/media/renuvo-lockup-horizontal-ivory.svg"
          test -s "$project_dir/media/renuvo-lockup-horizontal-ink.svg"
          test -s "$project_dir/media/music-bed-60s.wav"
          printf '%s\n' '{"authoringSkill":"hyperframes"}' > "$project_dir/hyperframes.json"
          output_path="$output_dir/$REQUESTED_FILENAME"
          printf 'PROJECT_DIR=%s\n' "$project_dir" >> "$GITHUB_ENV"
          printf 'OUTPUT_FILENAME=%s\n' "$REQUESTED_FILENAME" >> "$GITHUB_ENV"
          printf 'OUTPUT_PATH=%s\n' "$output_path" >> "$GITHUB_ENV"

      - name: Generate ElevenLabs narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          NARRATION_TEXT: ${{ inputs.narration_text }}
          ELEVENLABS_VOICE_ID: ${{ inputs.elevenlabs_voice_id }}
          ELEVENLABS_MODEL_ID: eleven_multilingual_v2
          NARRATION_OUTPUT: ${{ runner.temp }}/renuvo-hyperframes-project/media/narration.mp3
        run: |
          set -euo pipefail
          node scripts/generate-elevenlabs-narration.mjs
          test -s "$PROJECT_DIR/media/narration.mp3"
          narration_duration="$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "$PROJECT_DIR/media/narration.mp3")"
          awk -v duration="$narration_duration" 'BEGIN { if (duration <= 0 || duration > 36.50) exit 1 }'
          printf 'Verified ElevenLabs narration duration: %ss\n' "$narration_duration"

      - name: Validate HyperFrames composition
        run: |
          set -euo pipefail
          npx --no-install hyperframes check "$PROJECT_DIR"

      - name: Render 1080x1920 MP4 locally
        run: |
          set -euo pipefail
          npx --no-install hyperframes render "$PROJECT_DIR" \
            --output "$OUTPUT_PATH" \
            --fps 30 \
            --quality high \
            --strict

      - name: Verify rendered MP4
        run: |
          set -euo pipefail
          test -s "$OUTPUT_PATH"
          stream_probe="$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,avg_frame_rate \
            -of csv=p=0 "$OUTPUT_PATH")"
          IFS=',' read -r width height frame_rate <<< "$stream_probe"
          test "$width" = "1080"
          test "$height" = "1920"
          awk -F/ -v rate="$frame_rate" 'BEGIN { split(rate, p, "/"); if (p[2] == 0 || (p[1] / p[2]) < 29.99 || (p[1] / p[2]) > 30.01) exit 1 }'
          duration="$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "$OUTPUT_PATH")"
          awk -v duration="$duration" 'BEGIN { if (duration < 36.90 || duration > 37.10) exit 1 }'
          audio_streams="$(ffprobe -v error -select_streams a \
            -show_entries stream=index -of csv=p=0 "$OUTPUT_PATH" | wc -l | tr -d ' ')"
          test "$audio_streams" -ge 1
          printf 'Verified %sx%s at %s fps; duration %ss; audio streams %s\n' "$width" "$height" "$frame_rate" "$duration" "$audio_streams"

      - name: Publish rolling release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Renuvo renders" \
              --notes "Rolling release for n8n-dispatched HyperFrames renders."
          fi
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$OUTPUT_FILENAME"; then
            gh release delete-asset "$RELEASE_TAG" "$OUTPUT_FILENAME" --yes
          fi
          gh release upload "$RELEASE_TAG" "$OUTPUT_PATH"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$OUTPUT_FILENAME"
          printf 'Published %s\n' "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$OUTPUT_FILENAME"

      - name: Write render summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Renuvo HyperFrames render"
            echo
            echo "- Asset: \`${OUTPUT_FILENAME:-not-created}\`"
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- Renderer: \`hyperframes@0.8.30\` with local \`gsap@3\`"
            echo "- Audio: ElevenLabs narration plus original Renuvo music bed"
          } >> "$GITHUB_STEP_SUMMARY"
